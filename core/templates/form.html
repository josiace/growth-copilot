{% extends "base.html" %}{% block content %}
<h1 class="text-2xl font-extrabold">Nouveau projet</h1>
<p class="text-sm opacity-80">Plus tu es précis sur la cible et l'offre, meilleurs sont les posts. Tu pourras tout modifier dans Réglages.</p>
<form method="post" class="card space-y-3">{% csrf_token %}
{% for f in form %}<label class="block"><span class="text-sm font-semibold">{{ f.label }}</span>{{ f }}
{% for e in f.errors %}<span class="text-sm text-red-700 block">{{ e }}</span>{% endfor %}</label>{% endfor %}
<button class="btn w-full">Créer le projet</button></form>{% endblock %}
